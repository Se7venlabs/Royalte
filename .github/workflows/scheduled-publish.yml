name: Scheduled Content Publish

# Content Publishing Engine™ — Layer 3, Autonomous Publishing Engine.
#
# State-driven, not merge-driven: this workflow never merges N
# independently-authored branches into the same shared insertion point --
# that was the actual root cause of the old scheduler's failure (see
# governance/CONTENT_PUBLISHING_ROOT_CAUSE_REPORT.md). It runs
# scripts/content-publishing/publish.mjs against content-registry/articles/*.json
# (the single source of truth for what's approved and when it's due), and
# if anything changed, commits the regenerated derived artifacts (blog.html
# card region, blog-posts.js, sitemap.xml's article section, rss.xml,
# search-index.json) to a fresh, single-purpose branch and pushes it.
#
# This PR can never conflict the way the old scheduler's PRs did: it is
# always branched fresh from current `main` immediately before running, it
# is the ONLY writer of the files it touches, and it contains a full
# regeneration (never an incremental patch), so there is nothing for a
# second branch to have diverged from.
#
# WHY A PR, NOT A DIRECT PUSH -- this feature's original design pushed
# directly to `main`. Live production verification of PR #454's
# certification found that fails: `main`'s branch protection ruleset
# enforces its required status check even against direct pushes
# (`current_user_can_bypass: never`), which a direct push has no way to
# satisfy, since a check only ever attaches to a commit that has already
# been pushed. Going through a real PR is the correct way to satisfy that
# same protection this automation is not, and should not be, exempt from.
#
# AUTHENTICATION MODEL -- this workflow authenticates as a dedicated
# machine-account collaborator (`royalte-content-bot`, direct repo
# collaborator with `write` permission, not admin), via the fine-grained PAT
# in the `CONTENT_PUBLISHING_PAT` repo secret -- not the default
# `GITHUB_TOKEN`. Two things `GITHUB_TOKEN` could never do turned out to be
# necessary, in this order:
#
#   1. Opening a PR as `github-actions[bot]` requires the repo-level "Allow
#      GitHub Actions to create and approve pull requests" setting
#      (`can_approve_pull_request_reviews`), off by default. Enabling it
#      (done, still in effect, though no longer load-bearing for this
#      workflow specifically) doesn't fully solve it, because:
#   2. GitHub gates `pull_request`-triggered workflow runs (i.e. this repo's
#      own required `Run pipeline test` / `Validate content registry`
#      checks) behind a manual "Approve and run" click whenever the PR was
#      opened by `github-actions[bot]` -- confirmed via a live test where
#      both checks sat at `action_required` with zero jobs ever created,
#      and the subsequent merge attempt correctly failed on branch
#      protection rather than bypassing anything. This is GitHub enforcing
#      almost exactly this program's own governance rule (no automation
#      silently earns its own required checks) -- not a bug to route
#      around, so it wasn't routed around. A real collaborator identity
#      with established write access isn't subject to that gate, which is
#      why `royalte-content-bot` exists.
#
# Full rationale, exact API calls, PAT permission minimum (Contents:
# read/write, Pull requests: read/write, Metadata: read -- nothing else),
# and what stays unchanged (branch protection, required status checks, no
# required-review rule, no bypass_actors) is in
# governance/CONTENT_PUBLISHING_AUTHENTICATION_MODEL.md. Because all writes
# now go through the PAT, this workflow's own `GITHUB_TOKEN` no longer
# needs elevated permissions -- it stays at the repo default (`read`).
#
# Article content itself (public/blog/*.html, images) still merges via a
# normal, human-reviewed PR whenever it's ready — safe, because each
# article is a uniquely-named new file that never conflicts with another.
# This workflow only ever flips already-approved, already-scheduled
# registry entries live once their publish date arrives, and regenerates
# the shared listing surfaces — the only files that were ever conflict-
# prone under the old mechanism.

on:
  schedule:
    # 13:00 UTC year-round -- this is 9am ET during Daylight Time and 8am ET
    # during Standard Time (GitHub Actions cron does not shift for DST; the
    # previous scheduler had this identical property at the same UTC hour).
    - cron: '0 13 * * 2,4' # Tuesday and Thursday, 13:00 UTC
  workflow_dispatch: {} # manual trigger, e.g. to force a run without waiting for the cron

# GITHUB_TOKEN itself never writes anything -- every git push, PR create,
# and PR merge below authenticates as CONTENT_PUBLISHING_PAT instead (see
# AUTHENTICATION MODEL above). Left at the repo default (`read`) rather
# than requesting `contents`/`pull-requests: write` it would never use.
permissions:
  contents: read

# Never run two publish attempts concurrently -- without this, a manual
# workflow_dispatch overlapping the cron (or two manual triggers close
# together) could both read the registry, both attempt to flip the same
# due article, and open competing publish PRs. The Engine's own
# idempotency means this could never produce duplicate content, but it
# could produce a wasted/conflicting second PR needing manual cleanup --
# this eliminates that failure mode outright rather than relying on it
# being merely harmless. `cancel-in-progress: false` queues the second run
# instead of killing the first mid-write.
concurrency:
  group: content-publishing-engine
  cancel-in-progress: false

jobs:
  scheduled-publish:
    name: Run Content Publishing Engine™
    runs-on: ubuntu-latest
    steps:
      # Runs before Checkout, deliberately -- actions/checkout's own git
      # fetch is where an invalid/revoked/empty token surfaces as an opaque
      # transport-layer error ("could not read Username ... terminal
      # prompts disabled"), indistinguishable at that point from a dozen
      # other causes. A plain `gh api` call against the token in isolation,
      # with nothing else in play, turns that into one unambiguous
      # diagnosis at one step: present/absent, valid/invalid, right
      # identity, right permission -- never printing the token itself,
      # only its length and format prefix (safe: 4 characters of a
      # 40+-character high-entropy token discloses negligible information,
      # and this is standard, not a workaround).
      - name: Verify CONTENT_PUBLISHING_PAT authentication
        env:
          GH_TOKEN: ${{ secrets.CONTENT_PUBLISHING_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CONTENT_PUBLISHING_PAT is empty or not set -- check the repository secret at Settings > Secrets and variables > Actions (repository secrets, not an environment secret)."
            exit 1
          fi
          echo "Token present, length ${#GH_TOKEN}, prefix ${GH_TOKEN:0:4}... (ghp_ = classic, github_pat_ = fine-grained)"

          if ! LOGIN=$(gh api user -q .login 2>&1); then
            echo "::error::Token was rejected by the GitHub API (invalid, expired, or revoked): $LOGIN"
            exit 1
          fi
          echo "Authenticated as: $LOGIN"
          if [ "$LOGIN" != "royalte-content-bot" ]; then
            echo "::error::Expected to authenticate as royalte-content-bot, got $LOGIN -- check CONTENT_PUBLISHING_PAT."
            exit 1
          fi

          PERMISSION=$(gh api "repos/${GITHUB_REPOSITORY}" -q .permissions.push)
          echo "royalte-content-bot's collaborator role on ${GITHUB_REPOSITORY} grants write: $PERMISSION"
          if [ "$PERMISSION" != "true" ]; then
            echo "::error::royalte-content-bot does not have write access to ${GITHUB_REPOSITORY}."
            exit 1
          fi
          echo "Note: this confirms the account's collaborator role, not the token's own granted scope -- a token can still be rejected for git push (Contents: Read and write) or gh pr create (Pull requests: Read and write) even when this check passes. Those are exercised for real by the steps below."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Overrides the default GITHUB_TOKEN credential actions/checkout
          # configures for git -- every subsequent git push in this job
          # authenticates as CONTENT_PUBLISHING_PAT (royalte-content-bot)
          # as a result, not github-actions[bot]. See AUTHENTICATION MODEL
          # above for why that distinction is load-bearing.
          token: ${{ secrets.CONTENT_PUBLISHING_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Run publish.mjs
        run: node scripts/content-publishing/publish.mjs

      - name: Open, verify, and merge a self-contained publish PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.CONTENT_PUBLISHING_PAT }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing changed -- idempotent no-op, nothing to publish."
            exit 0
          fi

          git config user.name "royalte-content-bot"
          git config user.email "312678072+royalte-content-bot@users.noreply.github.com"

          BRANCH="content-publish/run-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"

          # `git add` fails atomically (stages nothing) if any pathspec in
          # the same invocation doesn't match a file -- so the always-
          # generated files and the optional education files (not live on
          # main yet) are added in separate calls, not one combined list.
          git add public/blog.html public/sitemap.xml public/js/blog-posts.js public/rss.xml public/search-index.json
          # `set -e` aborts on a standalone false test, so each optional
          # add is guarded with `|| true` -- "file doesn't exist yet" is
          # not a failure here.
          [ -f public/education/index.html ] && git add public/education/index.html || true
          [ -f public/js/education-posts.js ] && git add public/js/education-posts.js || true
          git add content-registry/
          git commit -m "chore(content-publishing): scheduled publish run"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --title "chore(content-publishing): scheduled publish run" \
            --body "Automated, self-contained publish run from the Content Publishing Engine™. Touches only Engine-owned generated files -- see content-registry/README.md." \
            --base main --head "$BRANCH")
          PR_NUMBER=$(basename "$PR_URL")
          echo "Opened PR #$PR_NUMBER: $PR_URL"

          # `gh pr checks --watch` errors out immediately -- "no checks
          # reported" -- if zero checks exist at its very first poll,
          # rather than waiting for GitHub to attach any. GitHub takes a
          # few seconds after a PR is opened to trigger and register the
          # pull_request-triggered check suites (Run pipeline test,
          # Validate content registry) on the new commit, so calling
          # --watch right after `gh pr create` loses this race every time
          # -- confirmed live (PR #460: every check existed and had
          # already passed by the time anyone looked, but this step had
          # failed one second after the PR opened). Poll the commit
          # itself, not `gh pr checks` (which has the identical "no
          # checks yet" error baked into its own non-watch mode too) for
          # at least one check run to exist, bounded, before handing off
          # to --watch for the real wait-for-completion.
          HEAD_SHA=$(git rev-parse HEAD)
          ATTEMPTS=0
          while true; do
            COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" -q '.total_count')
            [ "$COUNT" -gt 0 ] && break
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "$ATTEMPTS" -ge 12 ]; then
              echo "::error::No check runs appeared on commit ${HEAD_SHA} (PR #$PR_NUMBER) after 60s -- not just the startup race, something upstream is actually broken (workflow trigger failure or GitHub outage)."
              exit 1
            fi
            sleep 5
          done

          # This PR is always freshly branched from main immediately before
          # this step and touches only files this Engine exclusively owns --
          # there is nothing for it to conflict with. `gh pr checks --watch`
          # blocks until every check on the PR completes (the required "Run
          # pipeline test", plus "Validate content registry" if a registry
          # file changed, plus Vercel's own preview build); `--fail-fast`
          # aborts this run the moment any of them goes red, including a
          # non-required one -- deliberately conservative (fail loud and
          # retry next scheduled run, matching the Engine's existing
          # failure philosophy) rather than merging past an unexplained
          # red check just because it wasn't the one that was required.
          # Merging only proceeds if every check is green -- this
          # automation gets no bypass, same as every other merge here.
          gh pr checks "$PR_NUMBER" --watch --fail-fast
          gh pr merge "$PR_NUMBER" --rebase --delete-branch
