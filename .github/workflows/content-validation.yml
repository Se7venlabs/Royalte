name: Content Validation

# Content Publishing Engine™ — Workflow A. Runs on every PR touching
# article content or the registry. Checks the registry is internally
# consistent (required fields, valid slugs, no duplicate slugs, every
# *published* article's content file actually exists) -- it never merges
# or publishes anything, only fails the PR check if something is wrong.
#
# A scheduled-but-not-yet-merged article's contentPath legitimately may
# not exist yet (content merges via a separate, human-reviewed PR) -- that
# is not flagged here. See scripts/content-publishing/validate.mjs.

on:
  pull_request:
    paths:
      - 'public/blog/**'
      - 'public/education/**'
      - 'content-registry/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate content registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Run validate.mjs
        run: node scripts/content-publishing/validate.mjs
